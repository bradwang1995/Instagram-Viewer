<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OGInstagram 自托管核心验证</title><style>body{margin:0;background:#12151a;color:#eef0f4;font:16px/1.7 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px}h1{font-size:30px;margin:0}h2{margin-top:32px}.muted{color:#adb5c2}#stats{display:flex;flex-wrap:wrap;gap:16px;margin:24px 0}.stat{background:#232a35;border:1px solid #394451;border-radius:12px;padding:14px 22px;min-width:170px}.stat strong{display:block;font-size:27px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.gallery figure{margin:0;background:#202630;padding:8px;border-radius:10px}.gallery img{display:block;width:100%;height:240px;object-fit:contain;background:#0c0f12}.gallery figcaption{font-size:12px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #354050}input,button{font:inherit;padding:8px 14px;border-radius:7px;border:1px solid #5b6c80;background:#242e3b;color:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere}.ok{color:#7ee2ae}.bad{color:#ffa2a2}</style><main><h1>OGInstagram 自托管核心验证</h1><p class="muted">独立本地实验 · 上游 a92f537 · 本机直连 · 无公共 OG 中转 · 无 private helper</p><section id="stats"></section><p id="proof"></p><h2>20 条真实 post 的解析结果</h2><p class="muted">失败样本保留在结果中。HTTP 200 之外，还要求完整媒体对象；图片另做文件与浏览器解码检查。</p><table><thead><tr><th>Post</th><th>HTTP</th><th>完整</th><th>媒体数</th><th>耗时 ms</th><th>错误</th></tr></thead><tbody id="rows"></tbody></table><h2>手动核心查询</h2><p class="muted">输入 shortcode。重复查询可观察 fetched=false 是否命中缓存；查询新帖子会访问 Instagram。</p><form id="query"><input id="code" value="Dah3cQjFGxT" required pattern="[A-Za-z0-9_-]{1,24}"><button>查询一次</button></form><pre id="result"></pre><h2>已下载的真实图片</h2><p class="muted">以下图片从本机文件读取，刷新不依赖 OG 或 Instagram 请求。<span id="decoded"></span></p><section class="gallery" id="gallery"></section></main><script>
const text=(tag,value)=>{const element=document.createElement(tag);element.textContent=value;return element};
fetch('/lab/report').then(r=>r.json()).then(report=>{
for(const [label,value] of [['完整解析',report.metadata.filter(row=>row.complete).length+' / '+report.metadata.length],['图片文件',report.images.filter(row=>row.success).length+' / '+report.images.length],['热缓存',report.warm.filter(row=>!row.fetched&&row.complete).length+' / '+report.warm.length],['核心工作集',report.resources.workingSetMiB+' MiB']]){const box=text('div',label);box.className='stat';box.append(text('strong',value));document.querySelector('#stats').append(box)}
document.querySelector('#proof').textContent='重启后的持久缓存：'+report.restart.filter(row=>!row.fetched&&row.complete).length+' / '+report.restart.length+'；完整样本的冷请求 P50 / P95：'+report.coldP50Ms+' / '+report.coldP95Ms+' ms。';
for(const row of report.metadata){const tr=document.createElement('tr');tr.className=row.complete?'ok':'bad';for(const value of [row.shortcode,row.status,row.complete?'是':'否',row.mediaCount,row.elapsedMs,row.errorCode||'—'])tr.append(text('td',value));document.querySelector('#rows').append(tr)}
let loaded=0;for(const item of report.images.filter(row=>row.success)){const figure=document.createElement('figure');const image=document.createElement('img');image.alt=item.shortcode+' photo '+item.index;image.onload=()=>document.querySelector('#decoded').textContent='浏览器已解码 '+(++loaded)+' 张';image.src='/lab/image/'+item.file;figure.append(image,text('figcaption',item.shortcode+' · '+item.index));document.querySelector('#gallery').append(figure)}
}).catch(error=>document.querySelector('#proof').textContent='报告准备中：'+error.message);
document.querySelector('#query').onsubmit=async event=>{event.preventDefault();const code=document.querySelector('#code').value.trim();const result=document.querySelector('#result');result.textContent='查询中…';try{const r=await fetch('/lab/post/'+encodeURIComponent(code));const data=await r.json();delete data.post;result.textContent=JSON.stringify(data,null,2)}catch(error){result.textContent=error.message}};
</script></html>
